<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include seo.html %}
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="32x32">
  <link rel="icon" href="{{ '/assets/icons/icon-192.png' | relative_url }}" type="image/png" sizes="192x192">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/icons/apple-touch-icon.png' | relative_url }}">
  <meta name="theme-color" content="#ffffff">
  {%- capture css %}{% include site.css %}{% endcapture %}
  {%- assign font_path = '/assets/fonts/' | relative_url %}
  <style>{{ css | replace: "../fonts/", font_path | strip_newlines }}</style>
</head>
<body>
  {% include header.html %}
  <main class="main" id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
